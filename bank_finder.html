<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bank.Green - Find Sustainable Banks Near You</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: #f8f9fa;
            color: #2d3748;
        }

        .header {
            background: linear-gradient(135deg, #2d6a4f 0%, #40916c 100%);
            color: white;
            padding: 2rem;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }

        .header h1 {
            font-size: 2rem;
            font-weight: 700;
            margin-bottom: 0.5rem;
        }

        .header p {
            font-size: 1rem;
            opacity: 0.9;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 2rem;
        }

        .search-card {
            background: white;
            border-radius: 12px;
            padding: 2rem;
            margin-bottom: 2rem;
            box-shadow: 0 2px 12px rgba(0,0,0,0.08);
        }

        .search-form {
            display: grid;
            gap: 1.5rem;
        }

        .form-group {
            display: flex;
            flex-direction: column;
        }

        label {
            font-weight: 600;
            margin-bottom: 0.5rem;
            color: #4b5563;
        }

        input[type="text"], select {
            padding: 0.75rem;
            border: 2px solid #e5e7eb;
            border-radius: 8px;
            font-size: 1rem;
            transition: border-color 0.2s;
        }

        input[type="text"]:focus, select:focus {
            outline: none;
            border-color: #40916c;
        }

        .btn {
            background: #40916c;
            color: white;
            padding: 0.875rem 2rem;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
        }

        .btn:hover {
            background: #2d6a4f;
        }

        .btn:disabled {
            background: #9ca3af;
            cursor: not-allowed;
        }

        #map {
            width: 100%;
            height: 600px;
            border-radius: 12px;
            box-shadow: 0 2px 12px rgba(0,0,0,0.08);
            display: none;
            margin-bottom: 2rem;
        }

        .results-info {
            background: white;
            border-radius: 12px;
            padding: 1.5rem;
            margin-bottom: 2rem;
            box-shadow: 0 2px 12px rgba(0,0,0,0.08);
            display: none;
        }

        .recommended-banks {
            background: white;
            border-radius: 12px;
            padding: 1.5rem;
            margin-bottom: 2rem;
            box-shadow: 0 2px 12px rgba(0,0,0,0.08);
            display: none;
        }

        .recommended-banks h3 {
            color: #2d6a4f;
            margin-bottom: 1rem;
            font-size: 1.3rem;
        }

        .bank-list {
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }

        .bank-item {
            padding: 1rem;
            border-radius: 8px;
            border-left: 4px solid;
            background: #f8f9fa;
            transition: transform 0.2s;
        }

        .bank-item:hover {
            transform: translateX(4px);
        }

        .bank-item.great {
            border-left-color: #1a5c1a;
        }

        .bank-item.good {
            border-left-color: #52b788;
        }

        .bank-item.okay {
            border-left-color: #ffd60a;
        }

        .bank-name {
            font-weight: 700;
            font-size: 1.1rem;
            color: #2d3748;
            margin-bottom: 0.25rem;
        }

        .bank-rating {
            display: inline-block;
            padding: 0.25rem 0.75rem;
            border-radius: 20px;
            font-size: 0.875rem;
            font-weight: 600;
            margin-bottom: 0.5rem;
        }

        .rating-great {
            background: #1a5c1a;
            color: white;
        }

        .rating-good {
            background: #52b788;
            color: white;
        }

        .rating-okay {
            background: #ffd60a;
            color: #2d3748;
        }

        .bank-distance {
            color: #6b7280;
            font-size: 0.9rem;
            margin-bottom: 0.5rem;
        }

        .bank-locations {
            color: #6b7280;
            font-size: 0.85rem;
            margin-top: 0.25rem;
        }

        .bank-summary {
            color: #4b5563;
            font-size: 0.9rem;
            font-style: italic;
        }

        .legend {
            background: white;
            border-radius: 12px;
            padding: 1.5rem;
            margin-bottom: 2rem;
            box-shadow: 0 2px 12px rgba(0,0,0,0.08);
        }

        .legend h3 {
            color: #2d6a4f;
            margin-bottom: 1rem;
        }

        .legend-item {
            display: flex;
            align-items: center;
            margin-bottom: 0.75rem;
        }

        .legend-color {
            width: 24px;
            height: 24px;
            border-radius: 50%;
            margin-right: 0.75rem;
            border: 2px solid rgba(0,0,0,0.2);
        }

        .status-message {
            padding: 1rem;
            border-radius: 8px;
            margin-bottom: 1rem;
            font-weight: 500;
        }

        .status-error {
            background: #fee;
            color: #c00;
            border: 1px solid #fcc;
        }

        .status-success {
            background: #efe;
            color: #060;
            border: 1px solid #cfc;
        }

        .status-info {
            background: #eef;
            color: #006;
            border: 1px solid #ccf;
        }

        .no-results {
            text-align: center;
            padding: 2rem;
            color: #6b7280;
        }

        .loading-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(255, 255, 255, 0.95);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 9999;
        }

        .loading-content {
            text-align: center;
        }

        .spinner {
            border: 4px solid #e5e7eb;
            border-top: 4px solid #40916c;
            border-radius: 50%;
            width: 50px;
            height: 50px;
            animation: spin 1s linear infinite;
            margin: 0 auto 1rem;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .hint-text {
            font-size: 0.875rem;
            color: #6b7280;
            margin-top: 0.5rem;
        }
    </style>
</head>
<body>
    <div id="loadingOverlay" class="loading-overlay" style="display: none;">
        <div class="loading-content">
            <div class="spinner"></div>
            <h2 style="color: #2d6a4f;">Loading...</h2>
            <p style="color: #6b7280;" id="loadingText">Please wait</p>
        </div>
    </div>

    <div class="header">
        <h1>🌱 Bank.Green - Find Sustainable Banks Near You</h1>
        <p>Discover environmentally responsible banking options in your area</p>
    </div>

    <div class="container">
        <div class="search-card">
            <div class="search-form">
                <div class="form-group">
                    <label for="country">Country:</label>
                    <select id="country">
                        <option value="">Loading countries...</option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="postalCode">Postal/ZIP Code:</label>
                    <input type="text" id="postalCode" placeholder="e.g., 10001 or SW1A 1AA" />
                    <div class="hint-text">We'll use Nominatim to find your location</div>
                </div>
                <div class="form-group">
                    <label for="radius">Search Radius:</label>
                    <select id="radius">
                        <option value="10">10 km</option>
                        <option value="25">25 km</option>
                        <option value="50">50 km</option>
                        <option value="100">100 km</option>
                    </select>
                </div>
                <button class="btn" onclick="searchBanks()" id="searchBtn">Search Banks</button>
            </div>
        </div>

        <div id="statusMessage"></div>

        <div class="recommended-banks" id="recommendedBanks">
            <h3>🌟 Recommended Banks Near You</h3>
            <div class="bank-list" id="bankList"></div>
        </div>

        <div class="results-info" id="resultsInfo"></div>

        <div class="legend">
            <h3>Rating Legend</h3>
            <div class="legend-item">
                <div class="legend-color" style="background: #1a5c1a;"></div>
                <span><strong>Great (81+)</strong></span>
            </div>
            <div class="legend-item">
                <div class="legend-color" style="background: #52b788;"></div>
                <span><strong>Good (61-80)</strong></span>
            </div>
            <div class="legend-item">
                <div class="legend-color" style="background: #ffd60a;"></div>
                <span><strong>Okay (41-60)</strong></span>
            </div>
            <div class="legend-item">
                <div class="legend-color" style="background: #e63946;"></div>
                <span><strong>Bad (21-40)</strong></span>
            </div>
            <div class="legend-item">
                <div class="legend-color" style="background: #9d0208;"></div>
                <span><strong>Worst (0-20)</strong></span>
            </div>
            <div class="legend-item">
                <div class="legend-color" style="background: #6c757d;"></div>
                <span><strong>Unrated</strong></span>
            </div>
        </div>

        <div id="map"></div>
    </div>

    <script>
        let bankRatings = [];
        let map = null;
        let markersLayer = null;

        function showStatus(message, type = 'info') {
            const statusDiv = document.getElementById('statusMessage');
            statusDiv.innerHTML = `<div class="status-${type}">${message}</div>`;
            if (type !== 'info') {
                setTimeout(() => statusDiv.innerHTML = '', 5000);
            }
        }

        function showLoading(message) {
            document.getElementById('loadingOverlay').style.display = 'flex';
            document.getElementById('loadingText').textContent = message;
        }

        function hideLoading() {
            document.getElementById('loadingOverlay').style.display = 'none';
        }

        function calculateDistance(lat1, lon1, lat2, lon2) {
            const R = 6371;
            const dLat = (lat2 - lat1) * Math.PI / 180;
            const dLon = (lon2 - lon1) * Math.PI / 180;
            const a = Math.sin(dLat/2) * Math.sin(dLat/2) +
                    Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) *
                    Math.sin(dLon/2) * Math.sin(dLon/2);
            const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
            return R * c;
        }

        function normalizeText(text) {
            return text.toLowerCase()
                .replace(/\s+/g, ' ')
                .replace(/[^\w\s]/g, '')
                .trim();
        }

        function matchBankName(bankName, countryCode) {
            const normalized = normalizeText(bankName);
            
            // Very strict matching - require at least 5 characters
            if (normalized.length < 5) return null;
            
            for (const rating of bankRatings) {
                // Check if bank has country data and if it matches
                if (rating.countries) {
                    const bankCountries = rating.countries.toUpperCase().split(',').map(c => c.trim());
                    if (!bankCountries.includes(countryCode.toUpperCase())) {
                        continue; // Skip if country doesn't match
                    }
                }
                
                const ratingName = normalizeText(rating.name);
                
                // Require exact match only (case insensitive)
                if (ratingName === normalized) {
                    return rating;
                }
            }
            return null;
        }

        function getRatingColor(rating) {
            if (!rating || isNaN(rating)) return '#6c757d';
            if (rating > 80) return '#1a5c1a';
            if (rating >= 61) return '#52b788';
            if (rating >= 41) return '#ffd60a';
            if (rating >= 21) return '#e63946';
            return '#9d0208';
        }

        function getRatingLabel(rating) {
            if (!rating || isNaN(rating)) return 'Unrated';
            if (rating > 80) return 'Great';
            if (rating >= 61) return 'Good';
            if (rating >= 41) return 'Okay';
            if (rating >= 21) return 'Bad';
            return 'Worst';
        }

        function createCustomIcon(color, rating) {
            let size = 30;
            
            if (rating === null || isNaN(rating)) {
                size = 12;
            } else if (rating <= 40) {
                size = 22;
            }
            
            const halfSize = size / 2;
            
            return L.divIcon({
                className: 'custom-marker',
                html: `<div style="background-color: ${color}; width: ${size}px; height: ${size}px; border-radius: 50%; border: 3px solid white; box-shadow: 0 2px 8px rgba(0,0,0,0.3);"></div>`,
                iconSize: [size, size],
                iconAnchor: [halfSize, halfSize]
            });
        }

        function displayRecommendedBanks(banks, userLat, userLon) {
            const greatAndGood = banks
                .filter(b => b.rating !== null && b.rating > 60)
                .map(b => ({
                    ...b,
                    distance: calculateDistance(userLat, userLon, b.lat, b.lon)
                }));

            let recommended = [...greatAndGood];
            
            if (greatAndGood.length <= 2) {
                const okayBanks = banks
                    .filter(b => b.rating !== null && b.rating >= 41 && b.rating <= 60)
                    .map(b => ({
                        ...b,
                        distance: calculateDistance(userLat, userLon, b.lat, b.lon)
                    }));
                
                recommended = [...greatAndGood, ...okayBanks];
            }

            // Group by bank name and aggregate locations
            const bankGroups = {};
            recommended.forEach(bank => {
                const key = bank.name.toLowerCase();
                if (!bankGroups[key]) {
                    bankGroups[key] = {
                        name: bank.name,
                        rating: bank.rating,
                        ratingData: bank.ratingData,
                        distances: []
                    };
                }
                bankGroups[key].distances.push(bank.distance);
            });

            // Sort distances within each group and sort groups by closest location
            const groupedBanks = Object.values(bankGroups).map(group => {
                group.distances.sort((a, b) => a - b);
                group.closestDistance = group.distances[0];
                return group;
            }).sort((a, b) => a.closestDistance - b.closestDistance);

            const bankListDiv = document.getElementById('bankList');
            const recommendedDiv = document.getElementById('recommendedBanks');

            if (groupedBanks.length === 0) {
                bankListDiv.innerHTML = '<div class="no-results">No Great or Good rated banks found in this area.</div>';
                recommendedDiv.style.display = 'block';
                return;
            }

            bankListDiv.innerHTML = groupedBanks.map(bank => {
                let ratingClass = 'good';
                let ratingBadgeClass = 'rating-good';
                
                if (bank.rating > 80) {
                    ratingClass = 'great';
                    ratingBadgeClass = 'rating-great';
                } else if (bank.rating >= 41 && bank.rating <= 60) {
                    ratingClass = 'okay';
                    ratingBadgeClass = 'rating-okay';
                }

                const locationText = bank.distances.length > 1 
                    ? `📍 ${bank.distances.length} locations: ${bank.distances.map(d => d.toFixed(1) + ' km').join(', ')}`
                    : `📍 ${bank.distances[0].toFixed(1)} km away`;
                
                return `
                    <div class="bank-item ${ratingClass}">
                        <div class="bank-name">${bank.name}</div>
                        <span class="bank-rating ${ratingBadgeClass}">${getRatingLabel(bank.rating)} (${bank.rating.toFixed(0)})</span>
                        <div class="bank-locations">${locationText}</div>
                        ${bank.ratingData?.summary ? `<div class="bank-summary">${bank.ratingData.summary}</div>` : ''}
                    </div>
                `;
            }).join('');

            recommendedDiv.style.display = 'block';
        }

        async function geocodePostalCode(countryCode, postalCode) {
            // Use Nominatim (OpenStreetMap's geocoding service)
            const url = `https://nominatim.openstreetmap.org/search?country=${countryCode}&postalcode=${encodeURIComponent(postalCode)}&format=json&limit=1`;
            
            const response = await fetch(url, {
                headers: {
                    'User-Agent': 'BankGreenFinder/1.0'
                }
            });
            
            if (!response.ok) {
                throw new Error('Geocoding service unavailable');
            }
            
            const data = await response.json();
            
            if (data.length === 0) {
                return null;
            }
            
            return {
                lat: parseFloat(data[0].lat),
                lon: parseFloat(data[0].lon),
                placeName: data[0].display_name
            };
        }

        async function searchBanks() {
            const countryCode = document.getElementById('country').value.trim();
            const postalCode = document.getElementById('postalCode').value.trim();
            const radius = parseInt(document.getElementById('radius').value);

            if (!countryCode) {
                showStatus('Please select a country', 'error');
                return;
            }

            if (!postalCode) {
                showStatus('Please enter a postal code', 'error');
                return;
            }

            if (bankRatings.length === 0) {
                showStatus('Bank ratings still loading, please wait', 'error');
                return;
            }

            try {
                showLoading('Finding your location...');
                showStatus('Looking up postal code...', 'info');

                // Geocode the postal code
                const location = await geocodePostalCode(countryCode, postalCode);
                
                if (!location) {
                    hideLoading();
                    showStatus(`Postal code ${postalCode} not found in ${countryCode}. Please check and try again.`, 'error');
                    return;
                }

                showLoading('Searching for banks nearby...');
                showStatus(`Searching for banks near ${location.placeName}...`, 'info');

                const overpassUrl = 'https://overpass-api.de/api/interpreter';
                const query = `
                    [out:json][timeout:25];
                    (
                        node["amenity"="bank"](around:${radius * 1000},${location.lat},${location.lon});
                        way["amenity"="bank"](around:${radius * 1000},${location.lat},${location.lon});
                    );
                    out center;
                `;

                const response = await fetch(overpassUrl, {
                    method: 'POST',
                    body: query
                });
                
                if (!response.ok) {
                    throw new Error('Bank search service unavailable');
                }
                
                const data = await response.json();

                hideLoading();

                // Calculate appropriate zoom level based on radius
                let zoomLevel;
                if (radius <= 10) zoomLevel = 13;
                else if (radius <= 25) zoomLevel = 12;
                else if (radius <= 50) zoomLevel = 11;
                else zoomLevel = 10;

                // Initialize or update map - ALWAYS centered on location
                if (!map) {
                    map = L.map('map');
                    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
                        attribution: '© OpenStreetMap contributors',
                        maxZoom: 19,
                        minZoom: 8
                    }).addTo(map);
                }
                
                // Force center the map on the location
                map.setView([location.lat, location.lon], zoomLevel, {
                    animate: false
                });

                // Clear existing markers
                if (markersLayer) {
                    map.removeLayer(markersLayer);
                }
                markersLayer = L.layerGroup().addTo(map);

                // Add user location marker at exact coordinates
                const userMarker = L.marker([location.lat, location.lon], {
                    icon: L.divIcon({
                        className: 'search-location',
                        html: '<div style="background-color: #2563eb; width: 24px; height: 24px; border-radius: 50%; border: 4px solid white; box-shadow: 0 0 0 3px #2563eb;"></div>',
                        iconSize: [24, 24],
                        iconAnchor: [12, 12]
                    })
                }).addTo(markersLayer);
                
                userMarker.bindPopup('<strong>Your Location</strong><br>' + location.placeName);

                // Force map to recenter after marker is added
                setTimeout(() => {
                    map.invalidateSize();
                    map.setView([location.lat, location.lon], zoomLevel, {
                        animate: false
                    });
                }, 100);

                const banks = data.elements.map(element => {
                    const lat = element.lat || (element.center && element.center.lat);
                    const lon = element.lon || (element.center && element.center.lon);
                    const name = element.tags?.name || 'Unknown Bank';
                    const rating = matchBankName(name, countryCode);
                    
                    return {
                        name,
                        lat,
                        lon,
                        rating: rating ? parseFloat(rating.rating) : null,
                        ratingData: rating
                    };
                });

                let ratedCount = 0;
                banks.forEach(bank => {
                    const color = getRatingColor(bank.rating);
                    const label = getRatingLabel(bank.rating);
                    
                    if (bank.rating !== null) ratedCount++;

                    const tooltipContent = `<strong>${bank.name}</strong><br>Rating: ${bank.rating !== null ? `${bank.rating.toFixed(0)} - ${label}` : 'Not rated'}`;
                    const popupContent = `
                        <strong>${bank.name}</strong><br>
                        Rating: ${bank.rating !== null ? `${bank.rating.toFixed(0)} - ${label}` : 'Not rated'}<br>
                        ${bank.ratingData?.summary ? `<br><em>${bank.ratingData.summary}</em>` : ''}
                    `;

                    L.marker([bank.lat, bank.lon], {
                        icon: createCustomIcon(color, bank.rating)
                    }).addTo(markersLayer)
                      .bindTooltip(tooltipContent, { direction: 'top', offset: [0, -10] })
                      .bindPopup(popupContent);
                });

                displayRecommendedBanks(banks, location.lat, location.lon);

                document.getElementById('map').style.display = 'block';
                
                const resultsInfo = document.getElementById('resultsInfo');
                resultsInfo.innerHTML = `
                    <strong>Search Results:</strong> Found ${banks.length} banks within ${radius}km<br>
                    <strong>Rated Banks:</strong> ${ratedCount} of ${banks.length} banks have environmental ratings
                `;
                resultsInfo.style.display = 'block';

                showStatus(`✓ Found ${banks.length} banks (${ratedCount} rated)`, 'success');

            } catch (error) {
                hideLoading();
                showStatus('Error: ' + error.message, 'error');
                console.error(error);
            }
        }

        // Auto-load bank ratings on page load
        window.addEventListener('DOMContentLoaded', async function() {
            try {
                const csvResponse = await fetch('assets/bank_green_list_complete_rated.csv');
                const csvText = await csvResponse.text();
                Papa.parse(csvText, {
                    header: true,
                    complete: function(results) {
                        bankRatings = results.data.filter(row => row.name);
                        
                        // Extract unique countries from the CSV
                        const countriesInCSV = new Set();
                        bankRatings.forEach(bank => {
                            if (bank.countries) {
                                const countries = bank.countries.toUpperCase().split(',').map(c => c.trim());
                                countries.forEach(c => countriesInCSV.add(c));
                            }
                        });
                        
                        // Country name mapping (full names for display)
                        const countryNames = {
                            'US': 'United States',
                            'CA': 'Canada',
                            'GB': 'United Kingdom',
                            'DE': 'Germany',
                            'FR': 'France',
                            'ES': 'Spain',
                            'IT': 'Italy',
                            'AU': 'Australia',
                            'NZ': 'New Zealand',
                            'JP': 'Japan',
                            'NL': 'Netherlands',
                            'BE': 'Belgium',
                            'CH': 'Switzerland',
                            'AT': 'Austria',
                            'SE': 'Sweden',
                            'NO': 'Norway',
                            'DK': 'Denmark',
                            'FI': 'Finland',
                            'IE': 'Ireland',
                            'PT': 'Portugal',
                            'PL': 'Poland',
                            'CZ': 'Czech Republic',
                            'MX': 'Mexico',
                            'BR': 'Brazil',
                            'AR': 'Argentina',
                            'IN': 'India',
                            'CN': 'China',
                            'KR': 'South Korea',
                            'SG': 'Singapore',
                            'ZA': 'South Africa',
                            'RU': 'Russia',
                            'UA': 'Ukraine',
                            'TR': 'Turkey',
                            'SA': 'Saudi Arabia',
                            'AE': 'United Arab Emirates',
                            'EG': 'Egypt',
                            'NG': 'Nigeria',
                            'KE': 'Kenya',
                            'GH': 'Ghana',
                            'TH': 'Thailand',
                            'VN': 'Vietnam',
                            'MY': 'Malaysia',
                            'ID': 'Indonesia',
                            'PH': 'Philippines',
                            'PK': 'Pakistan',
                            'BD': 'Bangladesh',
                            'CL': 'Chile',
                            'CO': 'Colombia',
                            'PE': 'Peru',
                            'VE': 'Venezuela',
                            'GR': 'Greece',
                            'RO': 'Romania',
                            'HU': 'Hungary',
                            'SK': 'Slovakia',
                            'BG': 'Bulgaria',
                            'HR': 'Croatia',
                            'SI': 'Slovenia',
                            'LT': 'Lithuania',
                            'LV': 'Latvia',
                            'EE': 'Estonia',
                            'IS': 'Iceland',
                            'LU': 'Luxembourg',
                            'MT': 'Malta',
                            'CY': 'Cyprus'
                        };
                        
                        // Create array of countries with their names
                        const countryList = Array.from(countriesInCSV).map(code => ({
                            code: code,
                            name: countryNames[code] || code
                        })).sort((a, b) => a.name.localeCompare(b.name));
                        
                        // Populate country dropdown alphabetically by country name
                        const countrySelect = document.getElementById('country');
                        countrySelect.innerHTML = '<option value="">Select a country...</option>';
                        
                        countryList.forEach(country => {
                            const option = document.createElement('option');
                            option.value = country.code;
                            option.textContent = country.name;
                            countrySelect.appendChild(option);
                        });
                        
                        console.log(`Loaded ${bankRatings.length} bank ratings from ${countriesInCSV.size} countries`);
                        showStatus(`✓ Ready! Loaded ${bankRatings.length} bank ratings from ${countriesInCSV.size} countries`, 'success');
                    }
                });
            } catch (error) {
                showStatus('Error loading bank ratings: ' + error.message, 'error');
                console.error('Loading error:', error);
            }
        });
    </script>
</body>
</html>
