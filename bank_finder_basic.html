<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bank.Green - Find Sustainable Banks Near You</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: #f8f9fa;
            color: #2d3748;
        }

        .header {
            background: linear-gradient(135deg, #2d6a4f 0%, #40916c 100%);
            color: white;
            padding: 2rem;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }

        .header h1 {
            font-size: 2rem;
            font-weight: 700;
            margin-bottom: 0.5rem;
        }

        .header p {
            font-size: 1rem;
            opacity: 0.9;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 2rem;
        }

        .search-card {
            background: white;
            border-radius: 12px;
            padding: 2rem;
            margin-bottom: 2rem;
            box-shadow: 0 2px 12px rgba(0,0,0,0.08);
        }

        .file-input-group {
            margin-bottom: 1rem;
        }

        .file-input-group label {
            display: block;
            font-weight: 600;
            margin-bottom: 0.5rem;
            color: #4b5563;
        }

        .file-input-group input[type="file"] {
            display: block;
            padding: 0.5rem;
            border: 1px solid #d1d5db;
            border-radius: 6px;
            background: white;
            width: 100%;
        }

        .search-form {
            display: grid;
            gap: 1.5rem;
        }

        .form-group {
            display: flex;
            flex-direction: column;
        }

        label {
            font-weight: 600;
            margin-bottom: 0.5rem;
            color: #4b5563;
        }

        input[type="text"], select {
            padding: 0.75rem;
            border: 2px solid #e5e7eb;
            border-radius: 8px;
            font-size: 1rem;
            transition: border-color 0.2s;
        }

        input[type="text"]:focus, select:focus {
            outline: none;
            border-color: #40916c;
        }

        .btn {
            background: #40916c;
            color: white;
            padding: 0.875rem 2rem;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
        }

        .btn:hover {
            background: #2d6a4f;
        }

        .btn:disabled {
            background: #9ca3af;
            cursor: not-allowed;
        }

        #map {
            width: 100%;
            height: 600px;
            border-radius: 12px;
            box-shadow: 0 2px 12px rgba(0,0,0,0.08);
            display: none;
            margin-bottom: 2rem;
        }

        .results-info {
            background: white;
            border-radius: 12px;
            padding: 1.5rem;
            margin-bottom: 2rem;
            box-shadow: 0 2px 12px rgba(0,0,0,0.08);
            display: none;
        }

        .recommended-banks {
            background: white;
            border-radius: 12px;
            padding: 1.5rem;
            margin-bottom: 2rem;
            box-shadow: 0 2px 12px rgba(0,0,0,0.08);
            display: none;
        }

        .recommended-banks h3 {
            color: #2d6a4f;
            margin-bottom: 1rem;
            font-size: 1.3rem;
        }

        .bank-list {
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }

        .bank-item {
            padding: 1rem;
            border-radius: 8px;
            border-left: 4px solid;
            background: #f8f9fa;
            transition: transform 0.2s;
        }

        .bank-item:hover {
            transform: translateX(4px);
        }

        .bank-item.great {
            border-left-color: #1a5c1a;
        }

        .bank-item.good {
            border-left-color: #52b788;
        }

        .bank-item.okay {
            border-left-color: #ffd60a;
        }

        .bank-name {
            font-weight: 700;
            font-size: 1.1rem;
            color: #2d3748;
            margin-bottom: 0.25rem;
        }

        .bank-rating {
            display: inline-block;
            padding: 0.25rem 0.75rem;
            border-radius: 20px;
            font-size: 0.875rem;
            font-weight: 600;
            margin-bottom: 0.5rem;
        }

        .rating-great {
            background: #1a5c1a;
            color: white;
        }

        .rating-good {
            background: #52b788;
            color: white;
        }

        .rating-okay {
            background: #ffd60a;
            color: #2d3748;
        }

        .bank-distance {
            color: #6b7280;
            font-size: 0.9rem;
            margin-bottom: 0.5rem;
        }

        .bank-summary {
            color: #4b5563;
            font-size: 0.9rem;
            font-style: italic;
        }

        .legend {
            background: white;
            border-radius: 12px;
            padding: 1.5rem;
            margin-bottom: 2rem;
            box-shadow: 0 2px 12px rgba(0,0,0,0.08);
        }

        .legend h3 {
            color: #2d6a4f;
            margin-bottom: 1rem;
        }

        .legend-item {
            display: flex;
            align-items: center;
            margin-bottom: 0.75rem;
        }

        .legend-color {
            width: 24px;
            height: 24px;
            border-radius: 50%;
            margin-right: 0.75rem;
            border: 2px solid rgba(0,0,0,0.2);
        }

        .status-message {
            padding: 1rem;
            border-radius: 8px;
            margin-bottom: 1rem;
            font-weight: 500;
        }

        .status-error {
            background: #fee;
            color: #c00;
            border: 1px solid #fcc;
        }

        .status-success {
            background: #efe;
            color: #060;
            border: 1px solid #cfc;
        }

        .status-info {
            background: #eef;
            color: #006;
            border: 1px solid #ccf;
        }

        .no-results {
            text-align: center;
            padding: 2rem;
            color: #6b7280;
        }
    </style>
</head>
<body>
    <div class="header">
        <h1>🌱 Bank.Green - Find Sustainable Banks Near You</h1>
        <p>Discover environmentally responsible banking options in your area</p>
    </div>

    <div class="container">
        <div class="search-card">
            <div class="file-upload-section">
                <h3>📁 Upload Required Data Files</h3>
                <div class="file-input-group">
                    <label>Postal Code Database (allCountries.txt):</label>
                    <input type="file" id="postalFile" accept=".txt" />
                </div>
                <div class="file-input-group">
                    <label>Bank Ratings Database (CSV):</label>
                    <input type="file" id="bankRatingsFile" accept=".csv" />
                </div>
            </div>

            <div class="search-form">
                <div class="form-group">
                    <label for="country">Country Code:</label>
                    <select id="country">
                        <option value="">Select a country...</option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="postalCode">Postal/ZIP Code:</label>
                    <input type="text" id="postalCode" placeholder="Enter your postal code" />
                </div>
                <div class="form-group">
                    <label for="radius">Search Radius:</label>
                    <select id="radius">
                        <option value="25">25 km</option>
                        <option value="50">50 km</option>
                        <option value="100">100 km</option>
                    </select>
                </div>
                <button class="btn" onclick="searchBanks()" id="searchBtn">Search Banks</button>
            </div>
        </div>

        <div id="statusMessage"></div>

        <div class="recommended-banks" id="recommendedBanks">
            <h3>🌟 Recommended Banks Near You</h3>
            <div class="bank-list" id="bankList"></div>
        </div>

        <div class="results-info" id="resultsInfo"></div>

        <div class="legend">
            <h3>Rating Legend</h3>
            <div class="legend-item">
                <div class="legend-color" style="background: #1a5c1a;"></div>
                <span><strong>Great (81+)</strong></span>
            </div>
            <div class="legend-item">
                <div class="legend-color" style="background: #52b788;"></div>
                <span><strong>Good (61-80)</strong></span>
            </div>
            <div class="legend-item">
                <div class="legend-color" style="background: #ffd60a;"></div>
                <span><strong>Okay (41-60)</strong></span>
            </div>
            <div class="legend-item">
                <div class="legend-color" style="background: #e63946;"></div>
                <span><strong>Bad (21-40)</strong></span>
            </div>
            <div class="legend-item">
                <div class="legend-color" style="background: #9d0208;"></div>
                <span><strong>Worst (0-20)</strong></span>
            </div>
            <div class="legend-item">
                <div class="legend-color" style="background: #6c757d;"></div>
                <span><strong>Unrated</strong></span>
            </div>
        </div>

        <div id="map"></div>
    </div>

    <script>
        let postalData = [];
        let bankRatings = [];
        let map = null;
        let markersLayer = null;
        let countryCodes = new Set();

        document.getElementById('postalFile').addEventListener('change', loadPostalData);
        document.getElementById('bankRatingsFile').addEventListener('change', loadBankRatings);

        function showStatus(message, type = 'info') {
            const statusDiv = document.getElementById('statusMessage');
            statusDiv.innerHTML = `<div class="status-${type}">${message}</div>`;
            setTimeout(() => statusDiv.innerHTML = '', 5000);
        }

        function loadPostalData(e) {
            const file = e.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function(event) {
                const lines = event.target.result.split('\n');
                postalData = [];
                countryCodes.clear();
                
                lines.forEach(line => {
                    const parts = line.split('\t');
                    // Format: country, postal_code, place_name, admin1, admin2, admin3, admin4, place_name2, admin_code, lat, lon, accuracy
                    if (parts.length >= 10) {
                        const lat = parseFloat(parts[9]);
                        const lon = parseFloat(parts[10]);
                        
                        if (!isNaN(lat) && !isNaN(lon)) {
                            const entry = {
                                country: parts[0].trim(),
                                postalCode: parts[1].trim(),
                                placeName: parts[2].trim(),
                                lat: lat,
                                lon: lon
                            };
                            postalData.push(entry);
                            countryCodes.add(entry.country);
                        }
                    }
                });
                
                // Populate country dropdown
                const countrySelect = document.getElementById('country');
                countrySelect.innerHTML = '<option value="">Select a country...</option>';
                
                const sortedCountries = Array.from(countryCodes).sort();
                sortedCountries.forEach(code => {
                    const option = document.createElement('option');
                    option.value = code;
                    option.textContent = code;
                    countrySelect.appendChild(option);
                });
                
                showStatus(`✓ Loaded ${postalData.length} postal codes from ${countryCodes.size} countries`, 'success');
            };
            reader.readAsText(file);
        }

        function loadBankRatings(e) {
            const file = e.target.files[0];
            if (!file) return;

            Papa.parse(file, {
                header: true,
                complete: function(results) {
                    bankRatings = results.data.filter(row => row.name);
                    showStatus(`✓ Loaded ${bankRatings.length} bank ratings`, 'success');
                }
            });
        }

        function calculateDistance(lat1, lon1, lat2, lon2) {
            const R = 6371;
            const dLat = (lat2 - lat1) * Math.PI / 180;
            const dLon = (lon2 - lon1) * Math.PI / 180;
            const a = Math.sin(dLat/2) * Math.sin(dLat/2) +
                    Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) *
                    Math.sin(dLon/2) * Math.sin(dLon/2);
            const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
            return R * c;
        }

        function normalizeText(text) {
            return text.toLowerCase()
                .replace(/\s+/g, ' ')
                .replace(/[^\w\s]/g, '')
                .trim();
        }

        function matchBankName(bankName) {
            const normalized = normalizeText(bankName);
            const commonTerms = ['bank', 'banco', 'credit union', 'federal credit union', 'fcu', 'cu', 'national', 'trust', 'savings'];
            
            for (const rating of bankRatings) {
                const ratingName = normalizeText(rating.name);
                
                if (ratingName === normalized) return rating;
                
                let searchName = normalized;
                let ratingSearchName = ratingName;
                
                for (const term of commonTerms) {
                    searchName = searchName.replace(term, '').replace(/\s+/g, ' ').trim();
                    ratingSearchName = ratingSearchName.replace(term, '').replace(/\s+/g, ' ').trim();
                }
                
                if (searchName && ratingSearchName && 
                    (searchName === ratingSearchName || 
                     searchName.includes(ratingSearchName) || 
                     ratingSearchName.includes(searchName))) {
                    return rating;
                }
            }
            return null;
        }

        function getRatingColor(rating) {
            if (!rating || isNaN(rating)) return '#6c757d';
            if (rating > 80) return '#1a5c1a';
            if (rating >= 61) return '#52b788';
            if (rating >= 41) return '#ffd60a';
            if (rating >= 21) return '#e63946';
            return '#9d0208';
        }

        function getRatingLabel(rating) {
            if (!rating || isNaN(rating)) return 'Unrated';
            if (rating > 80) return 'Great';
            if (rating >= 61) return 'Good';
            if (rating >= 41) return 'Okay';
            if (rating >= 21) return 'Bad';
            return 'Worst';
        }

        function createCustomIcon(color, rating) {
            let size = 30;
            
            // Adjust size based on rating
            if (rating === null || isNaN(rating)) {
                size = 12; // Much smaller for unrated
            } else if (rating <= 40) {
                size = 22; // Slightly smaller for bad and worst
            }
            
            const halfSize = size / 2;
            
            return L.divIcon({
                className: 'custom-marker',
                html: `<div style="background-color: ${color}; width: ${size}px; height: ${size}px; border-radius: 50%; border: 3px solid white; box-shadow: 0 2px 8px rgba(0,0,0,0.3);"></div>`,
                iconSize: [size, size],
                iconAnchor: [halfSize, halfSize]
            });
        }

        function displayRecommendedBanks(banks, userLat, userLon) {
            const greatAndGood = banks
                .filter(b => b.rating !== null && b.rating > 60)
                .map(b => ({
                    ...b,
                    distance: calculateDistance(userLat, userLon, b.lat, b.lon)
                }))
                .sort((a, b) => a.distance - b.distance);

            let recommended = [...greatAndGood];
            
            // If 2 or fewer great/good banks, include okay banks
            if (greatAndGood.length <= 2) {
                const okayBanks = banks
                    .filter(b => b.rating !== null && b.rating >= 41 && b.rating <= 60)
                    .map(b => ({
                        ...b,
                        distance: calculateDistance(userLat, userLon, b.lat, b.lon)
                    }))
                    .sort((a, b) => a.distance - b.distance);
                
                recommended = [...greatAndGood, ...okayBanks].sort((a, b) => a.distance - b.distance);
            }

            const bankListDiv = document.getElementById('bankList');
            const recommendedDiv = document.getElementById('recommendedBanks');

            if (recommended.length === 0) {
                bankListDiv.innerHTML = '<div class="no-results">No Great or Good rated banks found in this area.</div>';
                recommendedDiv.style.display = 'block';
                return;
            }

            bankListDiv.innerHTML = recommended.map(bank => {
                let ratingClass = 'good';
                let ratingBadgeClass = 'rating-good';
                
                if (bank.rating > 80) {
                    ratingClass = 'great';
                    ratingBadgeClass = 'rating-great';
                } else if (bank.rating >= 41 && bank.rating <= 60) {
                    ratingClass = 'okay';
                    ratingBadgeClass = 'rating-okay';
                }
                
                return `
                    <div class="bank-item ${ratingClass}">
                        <div class="bank-name">${bank.name}</div>
                        <span class="bank-rating ${ratingBadgeClass}">${getRatingLabel(bank.rating)} (${bank.rating.toFixed(0)})</span>
                        <div class="bank-distance">📍 ${bank.distance.toFixed(1)} km away</div>
                        ${bank.ratingData?.summary ? `<div class="bank-summary">${bank.ratingData.summary}</div>` : ''}
                    </div>
                `;
            }).join('');

            recommendedDiv.style.display = 'block';
        }

        async function searchBanks() {
            const countryCode = document.getElementById('country').value.trim();
            const postalCode = document.getElementById('postalCode').value.trim();
            const radius = parseInt(document.getElementById('radius').value);

            if (!countryCode) {
                showStatus('Please select a country', 'error');
                return;
            }

            if (!postalCode) {
                showStatus('Please enter a postal code', 'error');
                return;
            }

            if (postalData.length === 0) {
                showStatus('Please upload the postal code database file', 'error');
                return;
            }

            if (bankRatings.length === 0) {
                showStatus('Please upload the bank ratings CSV file', 'error');
                return;
            }

            // Find location matching both country and postal code
            const location = postalData.find(p => 
                p.country === countryCode && 
                normalizeText(p.postalCode) === normalizeText(postalCode)
            );

            if (!location) {
                showStatus(`Postal code ${postalCode} not found in ${countryCode}`, 'error');
                return;
            }

            showStatus(`Searching for banks near ${location.placeName}, ${location.country}...`, 'info');

            const overpassUrl = 'https://overpass-api.de/api/interpreter';
            const query = `
                [out:json][timeout:25];
                (
                    node["amenity"="bank"](around:${radius * 1000},${location.lat},${location.lon});
                    way["amenity"="bank"](around:${radius * 1000},${location.lat},${location.lon});
                );
                out center;
            `;

            try {
                const response = await fetch(overpassUrl, {
                    method: 'POST',
                    body: query
                });
                const data = await response.json();

                if (!map) {
                    map = L.map('map').setView([location.lat, location.lon], 11);
                    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
                        attribution: '© OpenStreetMap contributors'
                    }).addTo(map);
                } else {
                    map.setView([location.lat, location.lon], 11);
                }

                if (markersLayer) {
                    markersLayer.clearLayers();
                } else {
                    markersLayer = L.layerGroup().addTo(map);
                }

                L.marker([location.lat, location.lon], {
                    icon: L.divIcon({
                        className: 'search-location',
                        html: '<div style="background-color: #2d6a4f; width: 20px; height: 20px; border-radius: 50%; border: 4px solid white; box-shadow: 0 0 0 2px #2d6a4f;"></div>',
                        iconSize: [20, 20],
                        iconAnchor: [10, 10]
                    })
                }).addTo(markersLayer).bindPopup('<strong>Your Location</strong>');

                const banks = data.elements.map(element => {
                    const lat = element.lat || (element.center && element.center.lat);
                    const lon = element.lon || (element.center && element.center.lon);
                    const name = element.tags?.name || 'Unknown Bank';
                    const rating = matchBankName(name);
                    
                    return {
                        name,
                        lat,
                        lon,
                        rating: rating ? parseFloat(rating.rating) : null,
                        ratingData: rating
                    };
                });

                let ratedCount = 0;
                banks.forEach(bank => {
                    const color = getRatingColor(bank.rating);
                    const label = getRatingLabel(bank.rating);
                    
                    if (bank.rating !== null) ratedCount++;

                    const tooltipContent = `<strong>${bank.name}</strong><br>Rating: ${bank.rating !== null ? `${bank.rating.toFixed(0)} - ${label}` : 'Not rated'}`;
                    const popupContent = `
                        <strong>${bank.name}</strong><br>
                        Rating: ${bank.rating !== null ? `${bank.rating.toFixed(0)} - ${label}` : 'Not rated'}<br>
                        ${bank.ratingData?.summary ? `<br><em>${bank.ratingData.summary}</em>` : ''}
                    `;

                    L.marker([bank.lat, bank.lon], {
                        icon: createCustomIcon(color, bank.rating)
                    }).addTo(markersLayer)
                      .bindTooltip(tooltipContent, { direction: 'top', offset: [0, -10] })
                      .bindPopup(popupContent);
                });

                displayRecommendedBanks(banks, location.lat, location.lon);

                document.getElementById('map').style.display = 'block';
                
                const resultsInfo = document.getElementById('resultsInfo');
                resultsInfo.innerHTML = `
                    <strong>Search Results:</strong> Found ${banks.length} banks within ${radius}km<br>
                    <strong>Rated Banks:</strong> ${ratedCount} of ${banks.length} banks have environmental ratings
                `;
                resultsInfo.style.display = 'block';

                showStatus(`✓ Found ${banks.length} banks (${ratedCount} rated)`, 'success');

            } catch (error) {
                showStatus('Error searching for banks: ' + error.message, 'error');
                console.error(error);
            }
        }
    // Add this at the end of your script section, before closing script
    window.addEventListener('DOMContentLoaded', async function() {
        showStatus('Loading data files...', 'info');
        
        try {
            // Load postal code data
            const postalResponse = await fetch('assets/allCountries.txt');
            const postalText = await postalResponse.text();
            processPostalData(postalText);
            
            // Load bank ratings
            const csvResponse = await fetch('assets/bank_green_list_complete_rated.csv');
            const csvText = await csvResponse.text();
            Papa.parse(csvText, {
                header: true,
                complete: function(results) {
                    bankRatings = results.data.filter(row => row.name);
                    showStatus(`✓ Ready! Loaded ${postalData.length} postal codes and ${bankRatings.length} bank ratings`, 'success');
                }
            });
        } catch (error) {
            showStatus('Error loading data files: ' + error.message, 'error');
        }
    });

    function processPostalData(text) {
        const lines = text.split('\n');
        postalData = [];
        countryCodes.clear();
        
        lines.forEach(line => {
            const parts = line.split('\t');
            if (parts.length >= 10) {
                const lat = parseFloat(parts[9]);
                const lon = parseFloat(parts[10]);
                
                if (!isNaN(lat) && !isNaN(lon)) {
                    const entry = {
                        country: parts[0].trim(),
                        postalCode: parts[1].trim(),
                        placeName: parts[2].trim(),
                        lat: lat,
                        lon: lon
                    };
                    postalData.push(entry);
                    countryCodes.add(entry.country);
                }
            }
        });
        
        // Populate country dropdown
        const countrySelect = document.getElementById('country');
        countrySelect.innerHTML = '<option value="">Select a country...</option>';
        
        const sortedCountries = Array.from(countryCodes).sort();
        sortedCountries.forEach(code => {
            const option = document.createElement('option');
            option.value = code;
            option.textContent = code;
            countrySelect.appendChild(option);
        });
    }
    </script>
</body>
</html>
